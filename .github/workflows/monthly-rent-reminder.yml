name: Monthly Rent Reminder

on:
  schedule:
    # 09:00 JST on the 25th of each month
    - cron: "0 0 25 * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://satcom-bot.fly.dev/internal/reminders/rent_and_utilities"
